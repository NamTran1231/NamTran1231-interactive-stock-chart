name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system Qt dependencies and Python requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check, pytest judge, and CLI/benchmark smoke checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m py_compile $(find src tests -name '*.py' | sort)
          pytest -v
          python3 -m src.main --cli --csv data/sample_ohlcv.csv
          python3 -m src.main --benchmark --count 10000
